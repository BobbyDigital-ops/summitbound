<!doctype html><meta charset="utf-8"><title>Cleanroom spire lab</title><style>body{background:#13202c;color:#eee;font:16px system-ui;padding:20px}canvas{width:32%;height:340px;background:#263b4c}button{padding:10px}</style><h1>Independent modular spires</h1><p>Composed from new rock prefabs, not the original level. Prototype geometry: not yet playable.</p><button onclick="seed++;draw()">New spires</button><output id="summary"></output><div id="canvases"></div><script src="/game/scripts/clean-parts-phase1.js"></script><script src="/game/scripts/clean-cinematic-textures.js"></script><script src="/game/scripts/clean-map-phase1.js"></script><script>
let seed=11;function draw(){const target=document.getElementById('canvases');target.innerHTML='';

</script>

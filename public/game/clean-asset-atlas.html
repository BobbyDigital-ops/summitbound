<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Summitbound | Cleanroom Asset Atlas</title>
<style>body{background:#101923;color:#d7e1ea;font:14px system-ui;margin:24px}h1{font-size:24px}p{max-width:800px;line-height:1.5}#atlas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.item{background:#1c2a37;border:1px solid #364958;border-radius:9px;padding:12px}.item canvas{width:100%;height:180px;background:linear-gradient(#162839,#304457);border-radius:5px}.meta{font-size:12px;color:#9eafc1}</style><h1>Summitbound — modular asset atlas</h1><p>Independent prefab catalogue. Yellow dots: platform mounting positions. Cyan and violet lines: mating sockets. All sprites are procedural vector definitions—not final painted textures. The original map is not loaded.</p><div id="stats"></div><div id="atlas"></div>
<script src="./scripts/clean-parts-phase1.js"></script><script src="./scripts/clean-cinematic-textures.js"></script><script>
const L=SummitParts,items=[...L.BASES,...L.EXTENSIONS,...L.SUMMITS,...L.PLATFORMS];
document.querySelector('#stats').textContent=L.BASES.length+' bases · '+L.EXTENSIONS.length+' extensions · '+L.SUMMITS.length+' summits · '+L.PLATFORMS.length+' platform variants';
for(const a of items){const el=document.createElement('div');el.className='item';const title=document.createElement('b');title.textContent=a.id;el.append(title);const cv=document.createElement('canvas');cv.width=400;cv.height=260;el.append(cv);const m=document.createElement('div');m.className='meta';m.textContent=a.role?('Mounts: '+a.mounts.map(q=>q.size).join(', ')+' | Connectors: '+a.sockets.map(q=>q.size).join(', ')):('Platform size '+a.size+' · '+a.width+' wide · '+a.finish+' · '+a.edge);el.append(m);document.querySelector('#atlas').append(el);const ctx=cv.getContext('2d'),poly=a.vertices||a.polygon;const xs=poly.map(v=>v[0]),ys=poly.map(v=>v[1]);const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),k=Math.min(352/(maxx-minx||1),210/(maxy-miny||1)),ox=24-minx*k,oy=22-miny*k;ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(ox+p[0]*k,oy+p[1]*k):ctx.moveTo(ox+p[0]*k,oy+p[1]*k));ctx.closePath();const fill=ctx.createLinearGradient(30,10,320,240);fill.addColorStop(0,'#91a5ab');fill.addColorStop(.46,'#475d6a');fill.addColorStop(1,'#1b2b39');ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle='#aec0ca';ctx.stroke();ctx.save();ctx.translate(ox,oy);ctx.scale(k,k);SummitCinematicTexture.render(ctx,a,{snow:true});ctx.restore();for(const mount of a.mounts||[]){ctx.beginPath();ctx.arc(ox+mount.x*k,oy+mount.y*k,4,0,Math.PI*2);ctx.fillStyle='#f5d68c';ctx.fill()}for(const socket of a.sockets||[]){ctx.beginPath();socket.vertices.forEach((p,i)=>i?ctx.lineTo(ox+p[0]*k,oy+p[1]*k):ctx.moveTo(ox+p[0]*k,oy+p[1]*k));ctx.strokeStyle=socket.side==='left'?'#77d4e2':'#c2a6f9';ctx.lineWidth=3;ctx.stroke()}}
</script></html>

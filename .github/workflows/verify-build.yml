name: Verify Summitbound build
on:
  push:
    branches: [main, 'dev/mega-v092-v097']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:ice
      - run: npm run test:cliff
      - run: npm run test:staff
      - run: npm run test:leaps
      - run: npm run test:art
      - run: npm run test:ascent
      - run: npm run test:vault
      - run: npm run test:mobile
      - run: npm run test:renderer
      - run: npm run test:browser
      - run: npm run build

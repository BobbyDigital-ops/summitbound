name: Verify Summitbound build
on:
  push:
    branches: [main, 'dev/mega-v092-v097', 'dev/visual-recovery-v099-v0912', 'dev/vault-dynamics-v0130', 'dev/five-peaks-challenge-and-bleak-art']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:ice
      - run: npm run test:cliff
      - run: npm run test:staff
      - run: npm run test:leaps
      - run: npm run test:art
      - run: npm run test:ascent
      - run: npm run test:vault
      - run: npm run test:mobile
      - run: npm run test:renderer
      - run: npm run test:browser
      - run: npm run test:visual
      - run: npm run test:terrain
      - run: npm run test:climb
      - run: npm run test:chasm
      - run: npm run test:procedural
      - run: npm run test:allroutes
      - run: npm run test:ice-art
      - run: npm run test:cache
      - run: npm run test:resolution
      - run: npm run test:template
      - run: npm run test:ice-network
      - run: npm run test:ice-snow
      - run: npm run test:terrain-art
      - run: npm run test:phase4b
      - run: npm run test:phase4c
      - run: npm run test:phase5
      - run: npm run test:phase6
      - run: npm run test:phase7
      - run: npm run test:phase8
      - run: npm run test:five-peaks
      - run: npm run test:peak-retry
      - run: npm run test:vault-dynamics
      - run: npm run test:precision-vault
      - run: npm run build

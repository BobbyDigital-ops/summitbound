name: Verify Summitbound build
on:
  push:
    branches: [main, 'dev/mega-v092-v097', 'dev/visual-recovery-v099-v0912', 'dev/vault-dynamics-v0130', 'dev/five-peaks-challenge-and-bleak-art']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      # Run every regression even when one fails; gate stays red until ALL pass.
      - name: Full regression suite and production build
        shell: bash
        run: |
          failed=0
          for suite in ice cliff staff leaps art ascent vault mobile renderer browser visual terrain climb chasm procedural allroutes ice-art cache resolution template ice-network ice-snow terrain-art phase4b phase4c phase5 phase6 phase7 phase8 five-peaks peak-retry vault-dynamics precision-vault reforge; do
            echo "::group::test:$suite"
            npm run "test:$suite" || { echo "::error title=Regression failure::test:$suite failed"; failed=1; }
            echo "::endgroup::"
          done
          echo "::group::Production build"
          npm run build || { echo "::error title=Build failure::Vite build failed"; failed=1; }
          echo "::endgroup::"
          exit "$failed"

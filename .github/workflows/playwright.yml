name: Summitbound Playwright Visual Testing
on:
  push:
    branches: [main, 'dev/modular-physical-v040', 'dev/modular-peak-playtest', 'dev/phase1-difficulty-challenge', 'dev/peak1-safe-landing-fix', 'dev/phase2-reachability-five-challenges', 'dev/phase2-showcase-widths', 'dev/level-engine-phase1', 'dev/v0364-mantle-physics', 'dev/v0363-grab-fix', 'dev/v0362-polish', 'dev/playwright-browser-ci', 'dev/v034-character-motion', 'dev/v036-character-integration', 'dev/v0361-character-detail']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Certify real modular course across seeds
        run: node --test tests/modular-physical-v040.test.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit featured course after platform-size redesign
        run: node --test tests/phase2-showcase-widths.test.cjs
      - name: Check mobile HUD and document versions match
        run: npm run test:mobile
      - name: Grade all five difficulty sections
        run: node --test tests/difficulty-engine-phase1.test.cjs
      - name: Audit and compare five showcase trajectories
        run: node --test tests/showcase-validator-phase2.test.cjs
      - name: Validate level generator templates
        run: node --test tests/level-engine-v1.test.cjs
      - name: Check real vault release curve
        run: node --test tests/release-curve-v0364.test.cjs
      - name: Test desktop and mobile gameplay
        run: npm run test:playwright
      - name: Upload screenshots videos and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summitbound-playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

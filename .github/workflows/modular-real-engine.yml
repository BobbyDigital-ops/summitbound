name: Summitbound Real Engine Modular Integration QA
on:
  push:
    branches: ['dev/phase4-real-engine-modular']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run preserved physics and existing course regression tests
        run: node --test tests/vault-dynamics.test.cjs tests/phase8-skill-foundation.test.cjs tests/spire-v10.test.cjs tests/spire-phase3-two-spire.test.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove original character, original simulation and real vault landing
        run: node tests/spire-real-engine-browser.cjs
      - name: Upload original-engine screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-engine-modular-v13
          path: test-results/real-engine-*.png
          retention-days: 7

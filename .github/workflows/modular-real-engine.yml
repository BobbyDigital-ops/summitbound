name: Summitbound Real Engine Modular Integration QA
on:
  push:
    branches: ['dev/phase4-real-engine-modular', 'dev/phase5-playable-triple-gaps', 'dev/phase6a-five-spire-course', 'dev/phase7ab-wider-physical-alpine', 'dev/tenfold-spire-spacing-visual-v17', 'dev/phase7cd-solid-ledges-stress']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run preserved physics and existing course regression tests
        run: node --test tests/modular-physical-v040.test.cjs tests/level-engine-v1.test.cjs tests/spire-triple-gap-v14.test.cjs tests/spire-phase6b-validation.test.cjs tests/spire-phase7ab-wide-alpine.test.cjs tests/spire-spacing-v17.test.cjs tests/spire-phase7cd-stress.test.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove original character, original simulation and real vault landing
        run: node tests/spire-real-engine-browser.cjs
      - name: Verify tenfold real-mesh preview and capture screenshots
        run: node tests/spire-spacing-v17-browser.cjs
      - name: Upload original-engine screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-phase7cd-certified
          path: |
            test-results/real-engine-*.png
            test-results/tenfold-gap-*.png
          retention-days: 7

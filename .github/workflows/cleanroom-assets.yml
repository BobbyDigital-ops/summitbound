name: Fresh vertical spire asset certification
on:
  push:
    branches: ['dev/phase1-cleanroom-map-engine']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vertical-spires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Certify new modular spire assets, scaffolds, ladders, vertical ice and rendered shapes
        run: node --test tests/spire-v10.test.cjs tests/spire-phase2.test.cjs tests/spire-course-v11.test.cjs tests/spire-phase3-two-spire.test.cjs

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install preview dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Inspect five generated, textured vertical spires in Chromium
        run: node tests/spire-v10-browser.cjs && node tests/spire-phase2-browser.cjs && node tests/spire-course-v11-browser.cjs && node tests/spire-phase3-browser.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spire-v10-visual-preview
          path: |
            test-results/spire-v10-*.png
            test-results/spire-v11-*.png
            test-results/spire-course-gap-*.png
            test-results/phase3-spire-*.png
          retention-days: 7

name: Fresh vertical spire asset certification
on:
  push:
    branches: ['dev/phase1-cleanroom-map-engine']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vertical-spires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Certify new modular spire assets, scaffolds, ladders, vertical ice and rendered shapes
        run: node --test tests/spire-v10.test.cjs
